# Parameters for robot_record.launch.py and robot_policy.launch.py on autoJetsonBot.
# Only values that are specific to the robot or must agree between nodes are listed; everything
# else is each node's default (docs/INTERFACES.md). The safety gate reads jbl_safety's own
# config/safety_gate.yaml first, then this file.
# Doubles are written with a decimal point: Humble and newer reject 10 for a double parameter.

# Calibrate both on your robot (docs/PROTOCOL.md sections 4 and 5) and write them here: this
# section reaches every node, so safety_gate, dock_judge and servo_baseline cannot disagree.
/**:
  ros__parameters:
    forward_angle: 0.0   # /scan angle that points straight ahead (URDF yaw 0; may be pi)
    hfov_rad: 1.0856     # 62.2 deg is a placeholder: the ESP32-CAM's lens is unmeasured (PROTOCOL section 5)

camera_node:
  ros__parameters:
    source: camera
    # The ESP32-CAM on Wi-Fi (docs/PROTOCOL.md section 4). Its address comes from the router, so
    # check it if nothing connects. It serves one client at a time: a browser open on the stream
    # blocks this node. A USB camera on the Jetson instead: device: "0", and no stream_setup.
    device: "http://192.168.219.118/stream"
    # Sent before every connection, because the camera forgets both when it reboots. size must
    # agree with width and height below (QVGA = 320x240, VGA = 640x480); 10 is the firmware's default.
    stream_setup: "/resolution?size=QVGA,/fps?val=10"
    stream_timeout_s: 2.0
    width: 320   # the dataset's own size; 640x480 is about 2.5 times the bytes per frame
    height: 240
    fps: 15.0             # both rates are caps, above the camera's 10 fps: every frame goes through
    compressed_fps: 15.0  # the recorded stream
    jpeg_quality: 85
    frame_id: camera_link

dock_judge:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    auto_end: true
    # The controller's request (/cmd_vel_in) counts as still only at |v| <= this (m/s); the
    # simulation results before v4 used 0.02, which passed a controller still creeping.
    request_still_v: 0.005

servo_baseline:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    # Also set camera_ahead_of_lidar_m once the camera is mounted (PROTOCOL section 5, step 8).
    # Stopped at range <= 0.27 m (target_range + range_tol), drive again only above 0.27 + this
    # (m), so lidar noise cannot toggle the stop (0.0 = the law before v4).
    stop_hysteresis: 0.03

policy_runner:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    rate_hz: 10.0
    max_image_age: 0.2
